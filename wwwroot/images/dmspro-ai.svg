<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Thân áo -->
  <rect x="18" y="42" width="44" height="28" rx="8" fill="#4f46e5"/>
  <!-- Cổ áo trắng -->
  <rect x="32" y="42" width="16" height="8" rx="3" fill="#e0e7ff"/>
  <!-- Logo DMS trên áo -->
  <text x="40" y="66" text-anchor="middle" font-size="7" font-weight="bold" fill="white" font-family="Arial,sans-serif">DMS</text>
  <!-- Đầu -->
  <circle cx="40" cy="30" r="14" fill="#fde68a"/>
  <!-- Mắt trái -->
  <circle cx="35" cy="28" r="2.5" fill="#1e1b4b"/>
  <circle cx="35.8" cy="27.2" r="0.8" fill="white"/>
  <!-- Mắt phải -->
  <circle cx="45" cy="28" r="2.5" fill="#1e1b4b"/>
  <circle cx="45.8" cy="27.2" r="0.8" fill="white"/>
  <!-- Miệng cười -->
  <path d="M35 34 Q40 38 45 34" stroke="#92400e" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Má -->
  <circle cx="33" cy="33" r="2.5" fill="#fca5a5" opacity="0.6"/>
  <circle cx="47" cy="33" r="2.5" fill="#fca5a5" opacity="0.6"/>
  <!-- Mũ DMS -->
  <rect x="24" y="17" width="32" height="5" rx="2" fill="#dc2626"/>
  <rect x="27" y="12" width="26" height="9" rx="4" fill="#dc2626"/>
  <!-- Chữ DMS trên mũ -->
  <text x="40" y="19.5" text-anchor="middle" font-size="5.5" font-weight="bold" fill="white" font-family="Arial,sans-serif">DMS</text>
  <!-- Vành mũ -->
  <rect x="22" y="21" width="36" height="3" rx="1.5" fill="#b91c1c"/>
  <!-- Tay trái giơ lên -->
  <rect x="7" y="44" width="13" height="7" rx="3.5" fill="#4f46e5" transform="rotate(-30 13 47)"/>
  <!-- Tay phải cầm tablet -->
  <rect x="60" y="42" width="13" height="7" rx="3.5" fill="#4f46e5" transform="rotate(30 67 45)"/>
  <!-- Tablet -->
  <rect x="62" y="34" width="14" height="18" rx="2" fill="#1e1b4b"/>
  <rect x="63.5" y="35.5" width="11" height="13" rx="1" fill="#38bdf8"/>
  <!-- Chart trên tablet -->
  <rect x="64.5" y="43" width="2" height="4" rx="0.5" fill="white"/>
  <rect x="67.5" y="41" width="2" height="6" rx="0.5" fill="white"/>
  <rect x="70.5" y="39" width="2" height="8" rx="0.5" fill="white"/>
  <!-- Chân trái -->
  <rect x="26" y="67" width="10" height="8" rx="4" fill="#312e81"/>
  <!-- Chân phải -->
  <rect x="44" y="67" width="10" height="8" rx="4" fill="#312e81"/>
</svg>
